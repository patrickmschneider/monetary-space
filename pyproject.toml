[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monetary-space"
version = "0.1.0"
description = "Single-screen UK monetary policy dashboard"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
  "requests>=2.31",
  "openpyxl>=3.1",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
