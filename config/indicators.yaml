indicators:
  # ------------------------------------------------------------------------
  # E. Expectations: are inflation expectations anchored at 2%?
  - id: dmp_prices
    name: Firms' expected own-price growth
    explain: >-
      What firms in the Bank of England's Decision Maker Panel expect to charge over the next year. Pricing intentions feed straight into inflation, so this is one of the most direct forward-looking signals. Above its pre-2020 average (about 2.4%), firms plan to raise prices faster than is consistent with 2% inflation.
    phrase: firms' price expectations
    block: E
    series:
    - DMP_PRICE_1Y
    transform: level
    unit: '%'
    freq: M
    lag_days: 10
    benchmark:
      method: pre2020_mean
    sigma:
      method: value
      value: 0.7
      rationale: The panel starts in 2017; its 2017–2019 SD (0.2pp) would pin the score at the clip. 0.7pp = SD excluding
        the 2020–2023 shock years (0.71pp), close to the pre-2020 SD of household expectations (0.65pp) (confirm).
    sign: 1
    smoothing: 3-month average (DMP headline)
    note: Year-ahead expected change in the firm's own prices; pre-2020 sample is 2017–2019.

  - id: household_expectations
    name: Household inflation expectations
    explain: >-
      Households' expectations of inflation over the next 12 months (Bank of England Inflation Attitudes Survey). Higher expectations can feed into wage demands and spending, making inflation more persistent. Households' expectations run above actual inflation on average, so the score compares them with their own pre-2020 average rather than with 2%.
    phrase: households' inflation expectations
    block: E
    series:
    - IAS_MEDIAN_1Y
    transform: level
    unit: '%'
    freq: Q
    lag_days: -19
    benchmark:
      method: pre2020_mean
    sigma:
      method: pre2020_sd
    sign: 1
    smoothing: none
    note: Median expected change in shop prices over the next 12 months. The survey provider appears to have changed
      from Ipsos to Savanta in 2026 (confirm for a break).

  - id: market_inflation
    name: Market-implied inflation, 5 years
    explain: >-
      Inflation over the next five years implied by gilt prices: the gap between conventional and index-linked yields, converted from RPI to a CPI basis. It moves daily and reflects investors' money at stake, but it also includes a premium for inflation risk, which rises when inflation is uncertain. Above its pre-2020 average, markets doubt that inflation will return to target quickly.
    phrase: market-implied inflation
    block: E
    series: [IUDSIZC]
    transform: [monthly_mean, rpi_breakeven_to_cpi]
    params:
      wedge: 0.82          # RPI minus CPI inflation, 1998–2019 average (ONS CZBH − D7G7); 1.5pp since 2022
      reform: "2030-02"    # RPI aligned with CPIH from February 2030
      horizon_years: 5
    unit: "%"
    freq: M
    lag_days: 3
    benchmark: {method: pre2020_mean}
    sigma:
      method: pre2020_sd
      since: '1998-01'     # Bank of England independence
    sign: 1
    smoothing: "Monthly average of the daily 5-year breakeven, converted to a CPI basis"
    note: "Gilt breakeven (nominal minus index-linked yields) for the next 5 years, less the RPI–CPI wedge for the years before the 2030 RPI reform. Includes inflation risk and liquidity premia."

  # ------------------------------------------------------------------------
  # D. Demand: is spending running ahead of the economy's capacity?
  - id: unemployment
    name: Unemployment rate vs u*
    explain: >-
      The share of the workforce looking for work, against our estimate of the lowest rate consistent with stable inflation (u*). Unemployment below u* means a tight labour market that pushes up wages and prices; above u* means slack. The sign is reversed, so a positive score means tight and inflationary.
    block: D
    series:
    - MGSX
    transform: level
    unit: '%'
    freq: M
    lag_days: 45
    benchmark:
      method: nairu
      label: u*, estimated NAIRU (config/nairu.yaml)
      compare_manual: u_star
    sigma:
      method: pre2020_sd
    sign: -1
    smoothing: 3-month average (LFS rolling quarter), dated by its last month
    note: LFS response rates are poor; payrolls are the cross-check.

  - id: vacancies_per_unemployed
    name: Vacancies per unemployed
    explain: >-
      Job vacancies per unemployed person: a measure of labour-market tightness that tracked UK pay pressure well after 2021. More vacancies per jobseeker means firms compete harder for workers and pay rises faster. Compared with its 2001–2019 average.
    block: D
    series:
    - AP2Y
    - MGSC
    transform: ratio
    unit: ratio
    freq: M
    lag_days: 45
    benchmark:
      method: pre2020_mean
    sigma:
      method: pre2020_sd
    sign: 1
    smoothing: Both series are rolling 3-month averages over the same window
    note: Vacancy survey starts 2001; pre-2020 sample is 2001–2019.

  - id: payrolls
    name: PAYE payrolled employees
    explain: >-
      Growth in the number of employees on company payrolls, from HMRC tax records, over the latest three months at an annual rate. It is timelier and more reliable than the survey-based employment figures. Growth faster than the pre-2020 norm means strong demand for labour.
    phrase: payroll employment
    block: D
    series:
    - RTI_PAYROLLS
    transform: annualised_3m3m
    drop_last: 1
    unit: '% ann.'
    freq: M
    lag_days: 45
    benchmark:
      method: pre2020_mean
    sigma:
      method: value
      value: 1.0
      rationale: Payrolls start in July 2014, too short for a pre-2020 SD. 1.0pp = SD of LFS employees' annualised
        quarterly growth 1992–2019 (1.48pp) scaled by the ratio of payroll to LFS growth SDs over 2015–2019 (0.73/1.10).
    sign: 1
    smoothing: 3 months on previous 3 months, annualised; flash month dropped
    note: The latest (flash) month is heavily revised and excluded.

  - id: gdp
    name: Real GDP growth vs potential
    explain: >-
      Real GDP growth over the latest three months against the economy's potential growth rate (about 1.4% a year, from the Bank's Market Participants Survey). Growth above potential uses up spare capacity and adds to inflation pressure; growth below it creates slack. It shows the change in the output gap, not its level.
    block: D
    series:
    - ECY2
    transform: annualised_3m3m
    unit: '% ann.'
    freq: M
    lag_days: 42
    benchmark:
      method: potential_growth
      label: potential growth, estimated (config/rstar.yaml)
    sigma:
      method: pre2020_sd
    sign: 1
    smoothing: 3 months on previous 3 months, annualised
    note: GDP growth above potential closes spare capacity. Potential is the r* model's trend growth.

  - id: capacity
    name: Capacity utilisation (Agents)
    explain: >-
      The Bank of England Agents' score for how hard firms are working their existing capacity, from conversations with businesses around the UK; 0 is normal. Firms working above normal capacity find it easier to raise prices. A negative score points to spare capacity.
    phrase: the Agents' capacity utilisation score
    block: D
    series:
    - AGENTS_CAPACITY
    transform: level
    unit: score
    freq: Q
    lag_days: -20
    benchmark:
      method: value
      value: 0
      label: 0 = normal utilisation
    sigma:
      method: value
      value: 0.75
      rationale: Scores start in 2017 Q4, too short for a pre-2020 SD. 0.75 = SD of the quarterly series excluding
        the 2020–2023 shock years (confirm).
    sign: 1
    smoothing: Quarterly average of Agents' rounds
    note: Scores are whole numbers from about 2022, fractional before.

  # ------------------------------------------------------------------------
  # S. Supply: is the economy's capacity growing more slowly than normal?
  - id: ulc
    name: Unit labour cost growth
    explain: >-
      Unit labour costs: pay per unit of output, or wage growth minus productivity growth. They are the main cost firms pass on to prices, especially in services. Growth of about 2% is consistent with the inflation target; faster growth pushes inflation up unless firms absorb it in their margins.
    phrase: unit labour costs
    block: S
    series:
    - DMWN
    transform: level
    unit: '% y/y'
    freq: Q
    lag_days: 140
    benchmark:
      method: value
      value: 2.0
      label: '2%: consistent with the inflation target at a constant labour share'
    sigma:
      method: pre2020_sd
      since: '1993-01'   # inflation targeting; the full sample includes the 1970s
    sign: 1
    smoothing: Year-on-year growth (published)
    note: 'Pay per unit of output: pay growth minus productivity growth. Published about 4.5 months after the quarter.'

  - id: productivity
    name: Productivity growth vs trend
    explain: >-
      Growth in output per hour worked against its own five-year trend. Weaker productivity means the economy produces less for the same effort, so for a given level of demand there is less spare capacity and more inflation pressure. The sign is reversed, so productivity below trend scores as inflationary.
    phrase: weak productivity
    block: S
    series:
    - LZVD
    transform: level
    unit: '% y/y'
    freq: Q
    lag_days: 140
    benchmark:
      method: trailing_mean
      years: 5
      label: its own 5-year trailing average
    sigma:
      method: pre2020_sd
      since: '1993-01'   # inflation targeting; the full sample includes the 1970s
    sign: -1
    smoothing: Year-on-year growth of output per hour (published)
    note: Productivity below trend lowers the economy's capacity, which is inflationary for a given level of demand.

  # ------------------------------------------------------------------------
  # C. Cost-push: are external costs pushing up prices?
  - id: brent
    name: Brent crude oil price
    explain: >-
      The world price of crude oil in US dollars, change on a year earlier. Oil reaches petrol prices within weeks and transport and production costs more slowly. It is measured in dollars so the exchange rate is not counted twice. Most of its effect on inflation is direct and temporary; it matters for policy mainly if it spills into pay and expectations.
    phrase: oil prices
    block: C
    series:
    - DCOILBRENTEU
    transform:
    - monthly_mean
    - pct_change_12m
    unit: '% y/y'
    freq: M
    lag_days: 5
    benchmark:
      method: value
      value: 0
      label: '0: no change on a year earlier'
    sigma:
      method: pre2020_sd
    sign: 1
    smoothing: Monthly average of daily prices, 12-month % change
    note: In US dollars, so the exchange rate is not counted twice.

  - id: gas
    name: UK wholesale gas price
    explain: >-
      The UK wholesale gas price (System Average Price), change on a year earlier. Gas drives household energy bills, through the Ofgem price cap a few months later, and costs for industry. Like oil, much of its effect is first-round; the risk is that it spills over into pay and inflation expectations.
    phrase: gas prices
    block: C
    series:
    - SAP_GAS
    transform: pct_change_12m
    unit: '% y/y'
    freq: M
    lag_days: 25
    benchmark:
      method: value
      value: 0
      label: '0: no change on a year earlier'
    sigma:
      method: value
      value: 36
      rationale: The System Average Price starts in 2018, too short for a pre-2020 SD. 36pp = SD of 12-month changes
        in the UK NBP day-ahead gas price, 2010–2019 (Ofgem monthly averages).
    sign: 1
    smoothing: Monthly average, 12-month % change
    note: Priced in sterling, a small overlap with the exchange rate that the team accepts.

  - id: sterling
    name: Sterling effective exchange rate
    explain: >-
      The sterling effective exchange rate against a basket of trading partners, change on a year earlier. A weaker pound raises import prices: roughly 60% of a fall reaches import prices and about a fifth reaches consumer prices over one to two years. The sign is reversed, so a depreciation scores as inflationary.
    block: C
    series:
    - XUDLBK67
    transform:
    - monthly_mean
    - pct_change_12m
    unit: '% y/y'
    freq: M
    lag_days: 3
    benchmark:
      method: value
      value: 0
      label: '0: no change on a year earlier'
    sigma:
      method: pre2020_sd
    sign: -1
    smoothing: Monthly average of daily index, 12-month % change
    note: 'A rise is an appreciation, which lowers import prices: the sign is negative.'

  - id: import_prices
    name: Import prices
    explain: >-
      Prices of goods imported into the UK, change on a year earlier. They are the pipeline through which global and exchange-rate shocks reach UK shop prices, typically over four to eight quarters. Rising import prices signal cost pressure still to come through.
    phrase: import prices
    block: C
    series:
    - GD74
    transform: pct_change_12m
    unit: '% y/y'
    freq: M
    lag_days: 20
    benchmark:
      method: value
      value: 0
      label: '0: no change on a year earlier'
    sigma:
      method: pre2020_sd
    sign: 1
    smoothing: 12-month % change of the NSA index
    note: 'Pipeline pressure: import costs reach consumer prices over about 4–8 quarters. Series starts Dec 2008.'

# Not scored (momentum and context): services CPI (D7NN), private regular pay (KAJ4), inactivity (LF2S),
# trading partners' leading indicator (OECD_CLI), 5y5y implied inflation (IUDSIZC/IUDMIZC).
