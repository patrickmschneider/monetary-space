# Scored indicators (spec Section 4). Cap: 14. Adding one means removing one.
#
# Series are raw downloads, stored as dated vintages. Indicators transform one or
# more series, then score them: z = sign·(x − benchmark)/sigma, clipped (weights.yaml).
#
# lag_days: usual days from the end of a period to its publication. An indicator is
# stale when its next release is more than freshness.stale_grace_days overdue.
#
# benchmark.method: value (cited constant) | pre2020_mean | manual (column of manual/mpr.csv)
# sigma.method:     pre2020_sd (needs ≥10 years before 2020) | value (with a rationale)

sources:
  ons:
    name: Office for National Statistics
    attribution: "Source: Office for National Statistics, licensed under the Open Government Licence v3.0."
  ons_rti:
    name: HMRC PAYE Real Time Information (via ONS)
    attribution: "Source: HMRC PAYE Real Time Information, published by the Office for National Statistics, licensed under the Open Government Licence v3.0."
  boe:
    name: Bank of England
    attribution: "Source: Bank of England."
  fred:
    name: FRED, Federal Reserve Bank of St. Louis
    attribution: "Source: U.S. Energy Information Administration via FRED, Federal Reserve Bank of St. Louis."
  oecd:
    name: OECD
    attribution: "Source: OECD Composite Leading Indicators, licensed under CC BY 4.0."
  boe_agents:
    name: Bank of England Agents
    attribution: "Source: Bank of England Agents' scores."
  dmp:
    name: Decision Maker Panel
    attribution: "Source: Decision Maker Panel (Bank of England, Stanford University and University of Nottingham)."
  boe_ias:
    name: Bank of England Inflation Attitudes Survey
    attribution: "Source: Bank of England Inflation Attitudes Survey."

