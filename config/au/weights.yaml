# Scoring parameters for the Australian edition (see config/uk/weights.yaml). Change these, not code.

z_clip: 3.0                # step 3: z clipped at ±z_clip
direction_threshold: 0.5   # step 4: |z| above this points up/down

# Step 5. Expectations, demand and supply blocks hold several noisy readings of one thing (anchoring,
# slack), so their z-scores are averaged. Cost-push indicators are separate channels that add up
# (owner's decision, 2026-10-27), so they are summed, and the sum is divided by its pre-2020 SD so
# the block stays on the z scale and the ±0.5 pressure line keeps its meaning.
block_aggregation: {C: standardised_sum}

verdict:
  # A verdict is flagged as borderline when a small change would flip it: pressure within this
  # distance of ±threshold (z units), or the real rate within this distance of a neutral-zone edge (pp).
  borderline: {pressure: 0.1, stance_pp: 0.1}

pressure:                  # step 6, the Phillips-curve blocks
  # Two weightings are computed and shown; `method` picks the one that drives the verdict.
  method: config
  # Literature-based, the same as the UK: full weight on second-round channels (expectations,
  # slack), little on first-round cost-push (confirm for Australia).
  weights: {E: 0.35, D: 0.25, S: 0.25, C: 0.15}
  # Estimated: each block's effect on CPI inflation 2–3 years out in an Australian Bernanke–Blanchard
  # model. Until analysis/results/au/bb_au.json exists only the config weighting is shown.
  estimated_from: analysis/results/au/bb_au.json
  estimated_map: {E: expectations, D: slack_demand, S: slack_supply, C: cost_push}
  threshold: 0.5
  cost_push_state:           # multiplier on the C weight: second-round effects are larger when inflation is high
    cpi_threshold: 3.5       # % headline CPI: the UK threshold (3.1%, BoE staff, Greene 2026) shifted up by the
                             # 0.5pp gap between the targets (2.5% vs 2%), until Australian LPs are estimated (confirm)
    width: 0.25              # logistic transition, pp
    ratio_from: analysis/results/au/passthrough_lp.json
    ratio_default: 2.0
    cap: 2.5

stance:                    # step 7
  # Stance = the policy rate against the neutral rate (owner's definition, 2026-09-29), as for the UK.
  policy_rate_series: AU_CASH_RATE
  policy_rate_name: Cash rate
  policy_rate_noun: cash rate           # mid-sentence: "a real cash rate of …"
  policy_rate_phrase: the cash rate     # with its article
  # Expected inflation over the next year: the SMP headline CPI forecast for the quarter a year
  # ahead, interpolated between half-year forecasts (manual/au/mpr.csv cpi_1y). The same
  # measure converts the market economists' nominal neutral rate (RBA survey) to real.
  expected_inflation_fields: [cpi_1y]
  rstar_band_min_half_width: 0.5      # pp

freshness:
  stale_grace_days: 14     # stale if the next release is more than this overdue
  new_days: 7              # a period first seen this recently is marked New

history:
  sparkline_months: 24
  saturation_since: "2021-01"   # clip share reported from this date; >25% carries a note
  saturation_note_share: 0.25
