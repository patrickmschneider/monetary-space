# Scoring parameters for the US edition (see config/uk/weights.yaml). Change these, not code.

z_clip: 3.0                # step 3: z clipped at ±z_clip
direction_threshold: 0.5   # step 4: |z| above this points up/down

pressure:                  # step 6, the Phillips-curve blocks
  # Two weightings are computed and shown; `method` picks the one that drives the verdict.
  method: config
  # Literature-based, the same as the UK: full weight on second-round channels (expectations,
  # slack), little on first-round cost-push (confirm for the US).
  weights: {E: 0.35, D: 0.25, S: 0.25, C: 0.15}
  # Estimated: each block's effect on PCE inflation 2–3 years out in a US Bernanke–Blanchard
  # model. Until analysis/results/us/bb_us.json exists only the config weighting is shown.
  estimated_from: analysis/results/us/bb_us.json
  estimated_map: {E: expectations, D: slack_demand, S: slack_supply, C: cost_push}
  threshold: 0.5
  cost_push_state:           # multiplier on the C weight: second-round effects are larger when inflation is high
    cpi_threshold: 3.1       # % headline inflation. The UK value (BoE staff, Greene 2026), carried over until the
                             # US state-dependent local projections are estimated (confirm)
    width: 0.25              # logistic transition, pp
    ratio_from: analysis/results/us/passthrough_lp.json
    ratio_default: 2.0
    cap: 2.5

stance:                    # step 7
  # Stance = the policy rate against the neutral rate (owner's definition, 2026-09-29), as for the UK.
  policy_rate_series: FEDFUNDS_TARGET  # midpoint of the target range
  policy_rate_name: Fed funds rate
  policy_rate_noun: fed funds rate      # mid-sentence: "a real fed funds rate of …"
  policy_rate_phrase: the fed funds rate  # with its article: "Where markets expect the fed funds rate to go"
  policy_rate_half_range: 0.125         # the FOMC sets a 25bp range; the series is its midpoint
  # Expected inflation over the next year: the SEP median PCE projection for the quarter a year
  # ahead, interpolated between calendar-year projections (manual/us/mpr.csv cpi_1y). The same
  # measure converts nominal neutral-rate estimates (the Survey of Market Expectations) to real.
  expected_inflation_fields: [cpi_1y]
  rstar_band_min_half_width: 0.5      # pp

freshness:
  stale_grace_days: 14     # stale if the next release is more than this overdue
  new_days: 7              # a period first seen this recently is marked New

history:
  sparkline_months: 24
  saturation_since: "2021-01"   # clip share reported from this date; >25% carries a note
  saturation_note_share: 0.25
