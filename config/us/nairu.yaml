# u* (NAIRU) for the US edition: the same multivariate filter as the UK (config/uk/nairu.yaml).
#
# DISABLED (2026-10-26): on US data the wage Phillips curve is flat (β 0.00–0.24 across ECI and
# average hourly earnings, samples from 1985, 1990 and 2001), so u* is not identified: it settles
# near the sample mean of unemployment (about 5–5.7%, above actual unemployment in 2019 and 2023)
# or, with end-of-quarter unemployment, at 3.4%, with 90% bands of ±1.1–1.7pp. Owner's decision
# (2026-10-26): the unemployment indicator uses the FOMC's longer-run median (manual/us/mpr.csv
# u_star) unless a better-identified estimate is found.
enabled: false
#
#   u_t  = u*_t + g_t (+ small noise)        g_t = ρ1·g_{t−1} + ρ2·g_{t−2} + ν_t
#   y_t  = c + a·y_{t−1} − β·g_t + ε_t       u*_t = u*_{t−1} + η_t
#   y    = ECI wage growth (q/q annualised) − expected inflation − trend productivity growth

series:
  pay_level: ECIWAG             # Employment Cost Index, wages and salaries, private industry (composition-fixed)
  unemployment: UNRATE
  household_expectations: MICH  # monthly, averaged to quarters
  cpi: PCE_YY                   # the target measure
  productivity: OPHNFB          # output per hour, nonfarm business

household_weight: 0.5           # expected inflation = 0.5·households + 0.5·last quarter's PCE inflation
cpi_lag_quarters: 1
recentre_expectations_to: 2.0   # households' pre-2020 mean shifted to the 2% target
productivity_trend_quarters: 20 # 5-year backward average of y/y productivity growth
sigma_eta: 0.15                 # pp per quarter: how fast u* may move (fixed, as for the UK)
sigma_u: 0.05                   # sampling noise in the monthly CPS unemployment rate, quarterly average, pp (confirm)
max_gap_persistence: 0.9        # cap on ρ1 + ρ2
start: "2001Q2"                 # ECI wages begin in 2001
exclude: [["2020Q1", "2021Q4"]] # pandemic swings in pay and unemployment
band_z: 1.645                   # 90% band shown on the chart
