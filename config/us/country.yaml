path: us/
lang: en-US
time_zone: America/New_York
time_label: New York time
tagline: A GUIDE TO US MONETARY POLICY
description: "Monetary Space: a guide to US monetary policy"
eyebrow: US MONETARY POLICY

central_bank: Federal Reserve
committee_short: FOMC
