# Scoring parameters (spec Section 3). Change these, not code.

z_clip: 3.0                # step 3: z clipped at ±z_clip
direction_threshold: 0.5   # step 4: |z| above this points up/down

# Step 5. Expectations, demand and supply blocks hold several noisy readings of one thing (anchoring,
# slack), so their z-scores are averaged. Cost-push indicators are separate channels that add up
# (owner's decision, 2026-10-27), so they are summed, and the sum is divided by its pre-2020 SD so
# the block stays on the z scale and the ±0.5 pressure line keeps its meaning.
block_aggregation: {C: standardised_sum}

verdict:
  # A verdict is flagged as borderline when a small change would flip it: pressure within this
  # distance of ±threshold (z units), or the real rate within this distance of a neutral-zone edge (pp).
  borderline: {pressure: 0.1, stance_pp: 0.1}

pressure:                  # step 6, restructured around the Phillips curve
  # Two weightings are computed and shown; `method` picks the one that drives the verdict.
  method: config
  # Literature-based (reports/UK cost push pass through.md): full weight on second-round
  # channels (expectations, slack), little on first-round cost-push.
  weights: {E: 0.35, D: 0.25, S: 0.25, C: 0.15}
  # Estimated: each block's effect on CPI inflation 2–3 years out in the UK
  # Bernanke–Blanchard model (analysis/bb_uk.py), normalised to sum to one.
  estimated_from: analysis/results/uk/bb_uk.json
  estimated_map: {E: expectations, D: slack_demand, S: slack_supply, C: cost_push}
  threshold: 0.5
  cost_push_state:           # multiplier on the C weight: second-round effects are larger when inflation is high
    cpi_threshold: 3.1       # % CPI inflation (BoE staff threshold, Greene 2026)
    width: 0.25              # logistic transition, pp
    ratio_from: analysis/results/uk/passthrough_lp.json   # high/low-state headline CPI response at 12 months
    ratio_default: 2.0
    cap: 2.5

stance:                    # step 7
  # Stance = the current policy setting against the neutral rate: the rate at which policy is
  # neither stimulatory nor contractionary (owner's definition, 2026-09-29). The market's expected
  # path is shown in the policy path chart but does not drive the stance.
  policy_rate_series: IUDBEDR         # Bank Rate
  policy_rate_name: Bank Rate
  # Expected inflation over the next year (MPR year-ahead CPI projection, manual/uk/mpr.csv). The same
  # measure converts nominal neutral-rate estimates (the Market Participants Survey) to real, so
  # the real gap equals the nominal gap.
  expected_inflation_fields: [cpi_1y]
  rstar_band_min_half_width: 0.5      # pp; r* and its band come from the model in config/uk/rstar.yaml

freshness:
  stale_grace_days: 14     # stale if the next release is more than this overdue
  new_days: 7              # a period first seen this recently is marked New

history:
  sparkline_months: 24
  saturation_since: "2021-01"   # clip share reported from this date; >25% carries a note
  saturation_note_share: 0.25
