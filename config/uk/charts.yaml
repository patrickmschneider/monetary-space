# Context charts (not scored): the economy at a glance. Series come from indicators.yaml.
# reference: a horizontal line from a value or a manual/uk/mpr.csv field, or the estimated u* path (nairu: true).
# ylim: fixed axis range; values outside it are clipped and listed in a note.

since: "2016-01"

charts:
  - id: cpi
    title: CPI inflation
    subtitle: "Consumer prices, % change on a year earlier"
    series: D7G7
    transform: level
    unit: "%"
    reference: {value: 2.0, label: "2% target"}

  - id: gdp
    title: GDP growth
    subtitle: "Real GDP, latest 3 months on a year earlier, %"
    series: ECY2
    transform: growth_3m_yoy
    unit: "%"
    reference: {value: 0}
    ylim: [-5, 10]

  - id: unemployment
    title: Unemployment rate
    subtitle: "% of the economically active, aged 16+, 3-month average"
    series: MGSX
    transform: level
    unit: "%"

  - id: bank_rate
    title: Bank Rate
    subtitle: "Bank of England policy rate, %, end of month"
    series: IUDBEDR
    transform: monthly_last
    unit: "%"
    decimals: 2
    step: true

  - id: cable
    title: Sterling–dollar ("cable")
    subtitle: "US dollars per pound, monthly average"
    series: XUDLUSS
    transform: monthly_mean
    unit: "$"
    decimals: 2

# Momentum and context table on the Inflation drivers tab (not scored). transform/weights as in indicators.yaml.
momentum:
  - name: Services CPI inflation
    series: [D7NN]
    unit: "%"
    note: Mostly domestic costs; about 3¼% is consistent with 2% overall
  - name: Core CPI inflation
    series: [DKO8]
    unit: "%"
    note: Excluding energy, food, alcohol and tobacco
  - name: Private-sector regular pay growth
    series: [KAJ4]
    unit: "%"
    note: 3-month average, y/y; about 3¼% is target-consistent
  - name: 5y5y implied inflation
    series: [IUDMIZC, IUDSIZC]
    transform: [forward_5y5y, monthly_mean]
    unit: "%"
    decimals: 2
    note: "Market-implied, 5–10 years ahead. RPI basis until 2030, CPIH after: not comparable with history"
  - name: Trading partners' leading indicator
    series: ["OECD_CLI:DEU", "OECD_CLI:FRA", "OECD_CLI:ITA", "OECD_CLI:ESP", "OECD_CLI:USA"]
    transform: weighted_mean
    weights: [0.25, 0.18, 0.13, 0.09, 0.35]
    note: OECD CLI, 100 = trend; euro area proxy and US weighted by UK exports
