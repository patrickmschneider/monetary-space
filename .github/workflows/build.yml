name: build

# Fetch, score and render the dashboard, save the day's data vintage to the
# `data` branch, and deploy site/ to GitHub Pages. Cron is UTC: each UK slot is
# scheduled for both GMT and BST, and scripts/gate.py lets the right one through.
on:
  schedule:
    - cron: "10 6 * * *"    # 07:10 UK in summer (BST)
    - cron: "10 7 * * *"    # 07:10 UK in winter (GMT)
    - cron: "15 11 * * *"   # 12:15 UK in summer, MPC days only
    - cron: "15 12 * * *"   # 12:15 UK in winter, MPC days only
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write     # push vintages to the data branch
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Gate scheduled runs to UK time
        id: gate
        run: python scripts/gate.py "${{ github.event_name }}" "${{ github.event.schedule }}"

      - name: Check out data branch
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          ref: data
          path: store

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -e ".[test]"

      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: pytest -q

      - name: Build
        if: steps.gate.outputs.run == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m monetary_space build --store store --out site

      - name: Commit vintage to data branch
        if: steps.gate.outputs.run == 'true'
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Vintage $(TZ=Europe/London date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
